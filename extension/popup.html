<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summary</title>
  <style>
    body { width: 240px; font-family: sans-serif; padding: 16px; }
    .btn { display:block; width:100%; padding:8px; background:#6366f1; color:#fff; border:none;
           border-radius:6px; cursor:pointer; margin-bottom:8px; font-size:14px; }
    .btn:hover { background:#4f46e5; }
    .info { color:#6b7280; font-size:12px; line-height:1.5; }
  </style>
</head>
<body>
  <button class="btn" id="open-sidepanel">Open in Side Panel</button>
  <p class="info">Opens a side panel summarizing the current YouTube video.</p>
  <script src="popup.js"></script>
</body>
</html>
