[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-youtube-summary"
version = "0.1.0"
description = "YouTube transcript (captions first, local Whisper fallback) for an agent to summarise, plus song/lofi/video downloads to a local media library."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ai-youtube-summary = "ai_youtube_summary.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ai_youtube_summary"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
]
